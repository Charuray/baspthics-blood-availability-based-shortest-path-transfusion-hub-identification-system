<!DOCTYPE html>
<html>
<head>
    <title>Donor Registration</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        
        header {
            background: #a00;
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 20px;
        }

        nav {
            margin-top: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
        }

        nav a:hover {
            background: white;
            color: #a00;
            border-radius: 5px;
        }
        form {
                flex-direction: column;
                gap: 10px;
                padding: 25px;
            }

        .form-group {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
        }
        

        main {
            width: 80%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Card Styles */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #a00;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        /* Request Button */
        .request-btn {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            padding: 8px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .request-btn:disabled {
            background: gray;
            cursor: not-allowed;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.4rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .unit {
            display: inline-block;
            margin-left: 8px;
            font-weight: normal;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .submit-btn {
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            main {
                width: 95%;
            }

            nav a {
                display: block;
                text-align: center;
                padding: 8px;
            }

            table, th, td {
                font-size: 14px;
            }
        }

    </style>
    <script>
        function submitForm(e) {
            e.preventDefault();
    
            const form = document.getElementById("donorForm");
    
            const donorData = {
                DonorID: document.getElementById("donorID").value,
                FullName: document.getElementById("fullName").value,
                DateOfBirth: document.getElementById("dob").value,
                Gender: form.gender.value,
                BloodGroup: document.getElementById("bloodGroup").value,
                PhoneNumber: document.getElementById("phone").value,
                Email: document.getElementById("email").value,
                Address: document.getElementById("address").value,
                City: document.getElementById("city").value,
                LastDonationDate: document.getElementById("lastDonation").value,
                Weight: document.getElementById("weight").value,
                HemoglobinLevel: document.getElementById("hemoglobin").value,
                ChronicDiseases: Array.from(form.querySelectorAll('input[name="diseases"]:checked')).map(el => el.value).join(", "),
                Medications: Array.from(form.querySelectorAll('input[name="medications"]:checked')).map(el => el.value).join(", "),
                CovidVaccinationStatus: document.getElementById("vaccine").value
            };
    
            console.log("Submitting:", donorData);
    
            // Example AJAX post
            fetch('/submit_donor', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(donorData)
            }).then(res => res.json()).then(data => {
                alert("Donor registered successfully!");
            }).catch(err => {
                console.error(err);
                alert("Failed to register donor.");
            });
        }
    </script>
</head>
<body>
    <header>
        <h1>Check Blood Availability</h1>
        <nav>
            <a href=http://127.0.0.1:5000/dashboard>Dashboard</a> |
            <a href=http://127.0.0.1:5000/login>Logout</a>
        </nav>
    </header>

    <main>
        <form id="donorForm" onsubmit="submitForm(event)">
            <h2 style="color: #a00; text-align: center;">Donor Registration</h2>
            {% set user_id = session['user_id'] %}
            <div class="form-group">
                <label for="donorID">Donor ID</label>
                <input type="text" id="donorID" name="donorID" value="{{ user_id }}" disabled required>
            </div>
    
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
    
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
    
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female" required> Female</label>
                    <label><input type="radio" name="gender" value="Other" required> Other</label>
                </div>
            </div>
    
            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>
                <select id="bloodGroup" name="bloodGroup" required>
                    <option value="">-- Select Blood Group --</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
    
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required maxlength="13">
            </div>
    
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
    
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="2"></textarea>
            </div>
    
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city">
            </div>
    
            <div class="form-group">
                <label for="lastDonation">Last Donation Date</label>
                <input type="date" id="lastDonation" name="lastDonation">
            </div>
    
            <div class="form-group">
                <label for="weight">Weight <span style="color: gray;">(in kg)</span></label>
                <input type="number" id="weight" name="weight" step="0.1" required>
            </div>
    
            <div class="form-group">
                <label for="hemoglobin">Hemoglobin Level <span style="color: gray;">(in g/dL)</span></label>
                <select id="hemoglobin" name="hemoglobin" required>
                    <option value="">-- Select Level --</option>
                    <option value="12.5">12.5</option>
                    <option value="13.0">13.0</option>
                    <option value="13.5">13.5</option>
                    <option value="14.0">14.0</option>
                    <option value="14.5">14.5</option>
                </select>
            </div>
    
            <div class="form-group">
                <label>Chronic Diseases</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="diseases" value="Diabetes"> Diabetes</label>
                    <label><input type="checkbox" name="diseases" value="Hypertension"> Hypertension</label>
                    <label><input type="checkbox" name="diseases" value="Thyroid"> Thyroid</label>
                    <label><input type="checkbox" name="diseases" value="Heart Disease"> Heart Disease</label>
                </div>
            </div>
    
            <div class="form-group">
                <label>Medications</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="medications" value="Metformin"> Metformin</label>
                    <label><input type="checkbox" name="medications" value="Amlodipine"> Amlodipine</label>
                    <label><input type="checkbox" name="medications" value="Thyroxine"> Thyroxine</label>
                </div>
            </div>
    
            <div class="form-group">
                <label for="vaccine">Covid Vaccination Status</label>
                <select id="vaccine" name="vaccine" required>
                    <option value="">-- Select Status --</option>
                    <option value="Not Vaccinated">Not Vaccinated</option>
                    <option value="Partially Vaccinated">Partially Vaccinated</option>
                    <option value="Fully Vaccinated">Fully Vaccinated</option>
                    <option value="Booster Dose Taken">Booster Dose Taken</option>
                </select>
            </div>
            <br><br>
            <div class="form-group" style="text-align: center;">
                <button type="submit" class="request-btn">Submit</button>
            </div>
        </form>
    </main>
