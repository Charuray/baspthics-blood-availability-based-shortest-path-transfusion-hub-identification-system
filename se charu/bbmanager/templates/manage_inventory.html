<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            background: #a00;
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 20px;
            width: 100%;
            position:relative;
        }
        nav {
            margin-top: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
        }

        nav a:hover {
            background: white;
            color: #a00;
            border-radius: 5px;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #b71c1c;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        select, button {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #b71c1c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #8e0000;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #b71c1c;
            color: white;
        }
        p {
            font-size: 16px;
            color: #333;
        }
        .low-units {
            background-color: #ffe6e6; 
            color: #a10000;             
            font-weight: bold;
        }

    </style>
</head>
<body>
    <header>
        <h1>Track Repository</h1>
        <nav>
            <a href="#">Dashboard</a> |
            <a href="http://127.0.0.1:5000/login">Logout</a>
        </nav>
    </header>
    <div class="container">

        <form id="blood" name="blood" method="POST" action="{{ url_for('manage_inventory') }}">
            <input type="hidden" id="user_id" name="user_id" value="{{ session.get('user_id', '') }}">

            <label for="Compatibility">Blood Type</label>
            <select id="Compatibility" name="Compatibility">
                <option value="" selected>Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <button type="submit">Load Records</button>
        </form>
    </div>

    <div class="container card">
        <h2>Stock Available</h2>
        {% if results %}
        <table>
            <tr>
                <th>BLOOD BANK ID</th>
                <th>BLOOD BANK NAME</th>
                <th>BLOOD GROUP</th>
                <th>UNITS</th>
            </tr>
            {% for row in results %}
            <tr class="{% if row[3] < 5 %}low-units{% endif %}">
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No requests made.</p>
        {% endif %}
    </div>
</body>
</html>
