<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Register Patient Details</title>
        <style>
             body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        
        header {
            background: #a00;
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 20px;
        }

        nav {
            margin-top: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
        }

        nav a:hover {
            background: white;
            color: #a00;
            border-radius: 5px;
        }
        form {
                flex-direction: column;
                gap: 10px;
                padding: 25px;
            }

        .form-group {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
        }
        

        main {
            width: 80%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Card Styles */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #a00;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        /* Request Button */
        .request-btn {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            padding: 8px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .request-btn:disabled {
            background: gray;
            cursor: not-allowed;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.4rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .unit {
            display: inline-block;
            margin-left: 8px;
            font-weight: normal;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .submit-btn {
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            main {
                width: 95%;
            }

            nav a {
                display: block;
                text-align: center;
                padding: 8px;
            }

            table, th, td {
                font-size: 14px;
            }
        }
        </style>
    </head>
    <body>
        <header>
            <h1>Check Blood Availability</h1>
            <nav>
                <a href=http://127.0.0.1:5000/dashboard>Dashboard</a> |
                <a href=http://127.0.0.1:5000/login>Logout</a>
            </nav>
        </header>
        <main>
            <form action="/submit_patient" method="POST">
                <h2>Patient Registration</h2>
                {% set user_id=session['user_id'] %}
              <div class="form-group">
                <label for="pid">Patient ID:</label>
                <input type="text" id="pid" name="pid" required value="{{ user_id}}" readonly>
              </div>

              <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required value="{{ pname }}" readonly>
              </div>
                
              <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
              
                <div class="form-group">
                <label for="gen">Gender:</label>
                <select id="gen" name="gen" required>
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              
                <div class="form-group">
                <label for="bgrp">Blood Group:</label>
                <input type="text" id="bgrp" name="bgrp" placeholder="e.g., A+, B-, O+">
                    </div>
                <div class="form-group">
                <label for="phno">Phone Number:</label>
                <input type="text" id="phno" name="phno" required>
                </div>

                <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
              </div>

                <div class="form-group">
                <label for="addr">Address:</label>
                <textarea id="addr" name="addr" rows="3"></textarea>
              </div>

                <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" name="city">
              </div>

                <div class="form-group">
                <label for="cond">Medical Conditions:</label>
                <textarea id="cond" name="cond" rows="2" placeholder="e.g., Diabetes, Hypertension"></textarea>
              </div>

                <div class="form-group">
                <label for="allergy">Allergies:</label>
                <textarea id="allergy" name="allergy" rows="2" placeholder="e.g., Penicillin, Dust"></textarea>
              </div>

                <div class="form-group">
                <label for="meds">Current Medications:</label>
                <textarea id="meds" name="meds" rows="2" placeholder="e.g., Metformin, Aspirin"></textarea>
              </div>

                <div class="form-group">
                <label for="vax_status">Vaccination Status:</label>
                <select id="vax_status" name="vax_status">
                  <option value="">Select Status</option>
                  <option value="Fully Vaccinated">Fully Vaccinated</option>
                  <option value="Partially Vaccinated">Partially Vaccinated</option>
                  <option value="Not Vaccinated">Not Vaccinated</option>
                </select>
              </div>

                <div class="form-group">
                <label for="notes">Doctor Notes:</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
              </div>

                <button type="submit">Submit Patient</button>
              </form>
              
        </main>
    </body>
</html>
