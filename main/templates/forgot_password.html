<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #a00;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #a00;
            color: white;
            font-weight: bold;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background: gray;
            cursor: not-allowed;
        }
        #otp-section, #reset-password-section {
            display: none;
        }
        .message {
            color: green;
            font-size: 14px;
            margin-top: 10px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>

        <!-- Request OTP Section -->
        <div id="request-otp-section">
            <input type="email" id="email" placeholder="Enter your email" required>
            <button onclick="requestOTP()">Request OTP</button>
            <p id="otp-message" class="message"></p>
            <p id="otp-error" class="error"></p>
        </div>

        <!-- Verify OTP Section -->
        <div id="otp-section">
            <input type="text" id="otp" placeholder="Enter OTP" required>
            <button onclick="verifyOTP()">Verify OTP</button>
            <p id="otp-verify-message" class="message"></p>
            <p id="otp-verify-error" class="error"></p>
        </div>

        <!-- Reset Password Section -->
        <div id="reset-password-section">
            <input type="password" id="new-password" placeholder="Enter new password" required>
            <input type="password" id="confirm-password" placeholder="Confirm new password" required>
            <button onclick="resetPassword()">Reset Password</button>
            <p id="reset-message" class="message"></p>
            <p id="reset-error" class="error"></p>
        </div>
    </div>

    <script>
        let userEmail = "";

        function requestOTP() {
            userEmail = document.getElementById("email").value;
            document.getElementById("otp-message").innerText = "";
            document.getElementById("otp-error").innerText = "";

            fetch("/request_otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: userEmail })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("request-otp-section").style.display = "none";
                    document.getElementById("otp-section").style.display = "block";
                    document.getElementById("otp-message").innerText = data.success;
                } else {
                    document.getElementById("otp-error").innerText = data.error;
                }
            })
            .catch(error => console.error("Error:", error));
        }

        function verifyOTP() {
            let otp = document.getElementById("otp").value;
            document.getElementById("otp-verify-message").innerText = "";
            document.getElementById("otp-verify-error").innerText = "";

            fetch("/validate_otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: userEmail, otp: otp })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("otp-section").style.display = "none";
                    document.getElementById("reset-password-section").style.display = "block";
                    document.getElementById("otp-verify-message").innerText = data.success;
                } else {
                    document.getElementById("otp-verify-error").innerText = data.error;
                }
            })
            .catch(error => console.error("Error:", error));
        }

        function resetPassword() {
            let newPassword = document.getElementById("new-password").value;
            let confirmPassword = document.getElementById("confirm-password").value;
            document.getElementById("reset-message").innerText = "";
            document.getElementById("reset-error").innerText = "";
            let forgot= true;

            if (newPassword.length < 8 || newPassword.length > 16) {
                document.getElementById("reset-error").innerText = "Password must be 8-16 characters long.";
                return;
            }

            if (newPassword !== confirmPassword) {
                document.getElementById("reset-error").innerText = "Passwords do not match.";
                return;
            }

            fetch("/change_password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    usernameOrEmail: userEmail,
                    currentPassword: "otp_verification",
                    newPassword: newPassword,
                    confirmNewPassword: confirmPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById("reset-message").innerText = data.success;
                    setTimeout(() => window.location.href = "/login", 2000);
                } else {
                    document.getElementById("reset-error").innerText = data.error;
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
