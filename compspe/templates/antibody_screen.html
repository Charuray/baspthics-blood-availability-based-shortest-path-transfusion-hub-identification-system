<body>
    <header>
        <h1>Antibody Screening Form</h1>
        <nav>
            <a href=http://127.0.0.1:5000/dashboard>Dashboard</a> |
            <a href=http://127.0.0.1:5000/login>Logout</a>
        </nav>
    </header>
    <main>
        <form action="/submit_screening" method="POST" id="screeningForm">
            
            <!-- Patient Information Section -->
            <div class="input-section">
                <label for="pid">Patient ID (PID)</label>
                <input type="text" id="pid" name="pid" required maxlength="7">

                <script>
                    const pidInput = document.getElementById("pid");
                    const prefix = "PA-";
                
                    // Set initial value
                    pidInput.value = prefix;
                
                    // Prevent deleting the prefix
                    pidInput.addEventListener("input", function () {
                        if (!pidInput.value.startsWith(prefix)) {
                            pidInput.value = prefix + pidInput.value.replace(/[^0-9a-zA-Z]/g, "").replace(prefix, "");
                        }
                    });
                
                    // Prevent moving cursor before prefix
                    pidInput.addEventListener("keydown", function (e) {
                        const cursorPosition = pidInput.selectionStart;
                
                        // Prevent backspace/delete within prefix
                        if ((e.key === "Backspace" || e.key === "Delete") && cursorPosition <= prefix.length) {
                            e.preventDefault();
                        }
                
                        // Prevent arrow keys moving cursor before prefix
                        if ((e.key === "ArrowLeft" || e.key === "Home") && cursorPosition <= prefix.length) {
                            e.preventDefault();
                        }
                    });
                
                    // Keep cursor after prefix on focus
                    pidInput.addEventListener("focus", function () {
                        if (pidInput.selectionStart < prefix.length) {
                            setTimeout(() => {
                                pidInput.setSelectionRange(prefix.length, prefix.length);
                            }, 0);
                        }
                    });
                </script>

                <label for="screen_date">Screening Date</label>
                <input type="date" id="screen_date" name="screen_date" value="<?= date('Y-m-d') ?>" required>

                <label for="cell_panel">Cell Panel</label>
                <select id="cell_panel" name="cell_panel" required>
                    <option value="Cell 1">Cell 1</option>
                    <option value="Cell 2">Cell 2</option>
                    <option value="Cell 3">Cell 3</option>
                </select>
            </div>
            
            <!-- Antigen Profile Section -->
            <div class="input-section">
                <label for="antigen_profile">Antigen Profile</label>
                <input type="text" id="antigen_profile" name="antigen_profile" placeholder="e.g., D+, C+, E-, c+, e+, K-" required>
            </div>
            
            <!-- Reactions Section -->
            <div class="input-section">
                <label for="reaction_is">Reaction at IS (Immediate Spin)</label>
                <select id="reaction_is" name="reaction_is" required>
                    <option value="0">0 (Negative)</option>
                    <option value="1">1+ (Weak Positive)</option>
                    <option value="2">2+ (Positive)</option>
                    <option value="3">3+ (Strong Positive)</option>
                </select>

                <label for="reaction_37c">Reaction at 37°C</label>
                <select id="reaction_37c" name="reaction_37c" required>
                    <option value="0">0 (Negative)</option>
                    <option value="1">1+ (Weak Positive)</option>
                    <option value="2">2+ (Positive)</option>
                    <option value="3">3+ (Strong Positive)</option>
                </select>

                <label for="reaction_ahg">Reaction at AHG (Anti-Human Globulin)</label>
                <select id="reaction_ahg" name="reaction_ahg" required>
                    <option value="0">0 (Negative)</option>
                    <option value="1">1+ (Weak Positive)</option>
                    <option value="2">2+ (Positive)</option>
                    <option value="3">3+ (Strong Positive)</option>
                </select>
            </div>

            <!-- Result Section -->
            <div class="input-section">
                <label for="screening_result">Screening Result</label>
                <select id="screening_result" name="screening_result" required>
                    <option value="Positive">Positive</option>
                    <option value="Negative">Negative</option>
                </select>
            
                <script>
                    const reactionIS = document.getElementById("reaction_is");
                    const reaction37C = document.getElementById("reaction_37c");
                    const reactionAHG = document.getElementById("reaction_ahg");
                    const screeningResult = document.getElementById("screening_result");
                
                    function updateScreeningResult() {
                        const isPositive = [reactionIS, reaction37C, reactionAHG].some(select => parseInt(select.value) > 0);
                        screeningResult.value = isPositive ? "Positive" : "Negative";
                    }
                
                    // Attach listeners to the three dropdowns
                    reactionIS.addEventListener("change", updateScreeningResult);
                    reaction37C.addEventListener("change", updateScreeningResult);
                    reactionAHG.addEventListener("change", updateScreeningResult);
                
                    // Trigger on page load in case values are prefilled
                    window.addEventListener("load", updateScreeningResult);
                </script>
                
            </div>

            <!-- Interpretation Section -->
            <div class="input-section">
                <label for="interpretation">Interpretation</label>
                <textarea id="interpretation" name="interpretation" rows="4" placeholder="e.g., Possible anti-D antibody detected" required></textarea>
            </div>

            <!-- Submit Button -->
             <br><br>
            <center><button type="submit" class="request-btn">Submit Screening</button></center>
        </form>
    </main>

    <script>
        document.getElementById("screeningForm").addEventListener("submit", function(event) {
            event.preventDefault(); // prevent default form submission
        
            const data = {
                pid: document.getElementById("pid").value,
                cell_panel: document.getElementById("cell_panel").value,
                antigen_profile: document.getElementById("antigen_profile").value,
                reaction_is: document.getElementById("reaction_is").value,
                reaction_37c: document.getElementById("reaction_37c").value,
                reaction_ahg: document.getElementById("reaction_ahg").value,
                screening_result: document.getElementById("screening_result").value,
                interpretation: document.getElementById("interpretation").value,
                screen_date: document.getElementById("screen_date").value
            };
        
            fetch("/submit_screening", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                alert(response.message);
            })
            .catch(error => {
                alert("Error: " + error);
            });
        });
        </script>

</body>
