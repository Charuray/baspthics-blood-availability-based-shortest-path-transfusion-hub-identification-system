<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank List</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 10px 20px;
            margin: 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Blood Bank List</h2>
    <form id="blood" name="blood">
        <div class="form-group">
            <label for="Compatibility">Blood Type</label>
            <select id="Compatibility" name="Compatibility" required>
                <option value="" selected>Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <br><br>
        </div>
        <button type="button" onclick="fetchRecords()">Load Records</button>
    </form>


    <table id="bloodTable" style="display: none;">
        <thead>
            <tr>
                <th>BID</th>
                <th>Name</th>
                <th>Blood Group</th>
                <th>Units</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        function fetchRecords() {
            const Compatibility = document.getElementById('Compatibility').value;

            if (!Compatibility) {
                showError("Please enter a blood group to search for.");
                return;
            }

            fetch('/get_records',{
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Compatibility:Compatibility }),
            })
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.getElementById('tableBody');
                    tableBody.innerHTML = ""; // Clear previous data
                    data.forEach(record => {
                        let row = `<tr>
                            <td>${record.BID}</td>
                            <td>${record.BNAME}</td>
                            <td>${record.B_GROUP}</td>
                            <td>${record.UNITS}</td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                    document.getElementById('bloodTable').style.display = 'table'; // Show table
                })
                .catch(error => console.error('Error fetching records:', error));
        }
    </script>
</body>
</html>
